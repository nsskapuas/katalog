<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price List Honda - Kapuas</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial, sans-serif;background:#f4f4f4;padding:0}
  .header{background:#E60012;color:#fff;padding:18px 14px 14px;text-align:center;border-radius:0 0 20px 20px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  .header h1{margin:0;font-size:24px;letter-spacing:1px}
  .header p{margin:4px 0 0;font-size:12px;opacity:.9}
  .wrap{padding:12px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;background:#fff;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .tabs button.active{background:#E60012;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chips button{padding:9px 16px;border:1px solid #ddd;background:#fff;border-radius:20px;font-weight:800;cursor:pointer;font-size:14px}
  .chips button.active{background:#111;color:#fff;border-color:#111}
  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
  .card h3{margin:0 0 10px;font-size:18px;color:#E60012;border-bottom:2px solid #E60012;padding-bottom:8px}
  table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
  th,td{border-bottom:1px solid #eee;padding:8px 8px;text-align:left;white-space:nowrap}
  tr:nth-child(even) td{background:#fafafa}
  td{color:#222}
  /* Baris pertama yang isinya judul brosur bikin tebel */
  tr:first-child td{font-weight:900;font-size:15px}
  .empty{text-align:center;padding:50px 20px;color:#999;background:#fff;border-radius:16px;line-height:1.6}
  .loading{text-align:center;padding:30px;color:#777}
  .footer{text-align:center;font-size:11px;color:#aaa;padding:12px}
</style>
</head>
<body>
<div class="header"><h1>PRICE LIST HONDA</h1><p>AREA: KAPUAS • Update Otomatis dari Spreadsheet</p></div>
<div class="wrap">
<div class="tabs">
  <button id="btnStylo" class="active" onclick="switchMotor('STYLO')">STYLO</button>
  <button id="btnPcx" onclick="switchMotor('PCX')">PCX</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"><div class="empty">👆 Silahkan pilih kode di atas dulu<br><small>Contoh: MFW, MFV, MGV...</small></div></div>
<div class="footer">Honda Kapuas - Harga dapat berubah sewaktu-waktu</div>
</div>
<script>
const CONFIG = {
  STYLO: { id: "1Sveq5riagQ08sH4YzjIlKJCyrVSGbhc-ZjHWZ1i-Vv4", tabs: ["MFW","MFV","MGV","MGX","MF1"] },
  PCX:   { id: "1ERT9boBpF16VrVNBSRD6P1hTm6D0IsX16at6R3ZPtBs", tabs: ["MTZ","MVZ","MWZ","MT1","MV1","MW1"] }
};
let current = "STYLO", activeCode = null;
let cache = {};
function switchMotor(m){
  current=m; activeCode=null; cache={};
  document.getElementById("btnStylo").className = m=="STYLO"?"active":"";
  document.getElementById("btnPcx").className = m=="PCX"?"active":"";
  renderChips();
  document.getElementById("list").innerHTML = `<div class="empty">👆 Silahkan pilih kode di atas dulu<br><small>Contoh: ${CONFIG[m].tabs.join(", ")}</small></div>`;
}
function renderChips(){
  const tabs = CONFIG[current].tabs;
  document.getElementById("chips").innerHTML = tabs.map(t=>`<button class="${activeCode==t?"active":""}" onclick="setCode('${t}')">${t}</button>`).join("");
}
async function setCode(c){
  activeCode=c; renderChips();
  document.getElementById("list").innerHTML = `<div class="loading">Lagi ngambil ${c}...</div>`;
  if(!cache[c]){
    try{
      const url = `https://docs.google.com/spreadsheets/d/${CONFIG[current].id}/gviz/tq?tqx=out:json&sheet=${c}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
      let rows = json.table.rows.map(r => (r.c||[]).map(cell => cell ? (cell.f || cell.v) : ""));
      let maxCol = 0;
      rows.forEach(r=>{ for(let i=r.length-1;i>=0;i--){ if(String(r[i]).trim()!==""){ maxCol=Math.max(maxCol,i); break; } } });
      rows = rows.map(r => r.slice(0, maxCol+1));
      rows = rows.filter(r => r.some(cell => String(cell).trim() !== ""));
      let keepCol = [];
      for(let col=0; col<=maxCol; col++){
        if(rows.some(r => String(r[col]||"").trim() !== "")) keepCol.push(col);
      }
      rows = rows.map(r => keepCol.map(col => r[col]||""));
      cache[c] = rows;
    }catch(e){ cache[c] = [["Gagal ambil "+c]]; }
  }
  const rows = cache[c];
  const table = `<table>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</table>`;
  document.getElementById("list").innerHTML = `<div class="card"><h3>[${c}] PRICE LIST</h3>${table}</div>`;
}
renderChips();
</script>
</body>
</html>
