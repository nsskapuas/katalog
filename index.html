<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price List Honda - Kapuas</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial;background:#f2f2f2;padding:12px}
  h1{text-align:center;font-size:22px;margin:6px 0 2px} .sub{text-align:center;color:#777;font-size:13px;margin-bottom:12px}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;background:#ddd}
  .tabs button.active{background:#d60000;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chips button{padding:8px 14px;border:1px solid #ddd;background:#fff;border-radius:20px;font-weight:700;cursor:pointer}
  .chips button.active{background:#111;color:#fff}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
  .card h3{margin:0 0 10px;font-size:18px}
  table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
  th,td{border:1px solid #eee;padding:7px 8px;text-align:left;white-space:nowrap}
  td{color:#222}
  .empty{text-align:center;padding:40px 20px;color:#999;background:#fff;border-radius:14px}
  .loading{text-align:center;padding:30px;color:#777}
</style>
</head>
<body>
<h1>PRICE LIST HONDA</h1><div class="sub">AREA: KAPUAS - Update Otomatis dari Spreadsheet</div>
<div class="tabs">
  <button id="btnStylo" class="active" onclick="switchMotor('STYLO')">STYLO</button>
  <button id="btnPcx" onclick="switchMotor('PCX')">PCX</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"><div class="empty">👆 Silahkan pilih kode di atas dulu<br><small>Contoh: MFW, MFV, MGV...</small></div></div>
<script>
const CONFIG = {
  STYLO: { id: "1Sveq5riagQ08sH4YzjIlKJCyrVSGbhc-ZjHWZ1i-Vv4", tabs: ["MFW","MFV","MGV","MGX","MF1"] },
  PCX:   { id: "1ERT9boBpF16VrVNBSRD6P1hTm6D0IsX16at6R3ZPtBs", tabs: ["MTZ","MVZ","MWZ","MT1","MV1","MW1"] }
};
let current = "STYLO", activeCode = null; // <-- awalnya kosong, gak ada yang dipilih
let cache = {};

function switchMotor(m){
  current=m; activeCode=null; cache={};
  document.getElementById("btnStylo").className = m=="STYLO"?"active":"";
  document.getElementById("btnPcx").className = m=="PCX"?"active":"";
  renderChips();
  document.getElementById("list").innerHTML = `<div class="empty">👆 Silahkan pilih kode di atas dulu<br><small>Contoh: ${CONFIG[m].tabs.join(", ")}</small></div>`;
}
function renderChips(){
  const tabs = CONFIG[current].tabs;
  // SEMUA SUDAH DIHAPUS, tinggal kode-kode aja
  document.getElementById("chips").innerHTML = tabs.map(t=>`<button class="${activeCode==t?"active":""}" onclick="setCode('${t}')">${t}</button>`).join("");
}
async function setCode(c){
  activeCode=c; renderChips();
  document.getElementById("list").innerHTML = `<div class="loading">Lagi ngambil ${c}...</div>`;
  if(!cache[c]){
    try{
      const url = `https://docs.google.com/spreadsheets/d/${CONFIG[current].id}/gviz/tq?tqx=out:json&sheet=${c}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
      let rows = json.table.rows.map(r => (r.c||[]).map(cell => cell ? (cell.f || cell.v) : ""));
      // 1. Buang kolom yang kosong semua
      let maxCol = 0;
      rows.forEach(r=>{ for(let i=r.length-1;i>=0;i--){ if(String(r[i]).trim()!==""){ maxCol=Math.max(maxCol,i); break; } } });
      rows = rows.map(r => r.slice(0, maxCol+1));
      // 2. Buang baris yang kosong semua
      rows = rows.filter(r => r.some(cell => String(cell).trim() !== ""));
      // 3. Buang kolom yang kosong semua (misal kolom pemisah)
      let keepCol = [];
      for(let col=0; col<=maxCol; col++){
        if(rows.some(r => String(r[col]||"").trim() !== "")) keepCol.push(col);
      }
      rows = rows.map(r => keepCol.map(col => r[col]||""));
      cache[c] = rows;
    }catch(e){ cache[c] = [["Gagal ambil "+c]]; }
  }
  const rows = cache[c];
  const table = `<table>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</table>`;
  document.getElementById("list").innerHTML = `<div class="card"><h3>[${c}]</h3>${table}</div>`;
}
renderChips();
</script>
</body>
</html>
