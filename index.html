<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4}
.header{background:#CC0000;color:#fff;padding:16px;text-align:center}
.header h1{margin:0;font-size:20px}
.wrap{padding:14px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{padding:12px 18px;border:0;border-radius:20px;font-weight:bold;cursor:pointer;margin:4px}
.btn-tipe,.btn-kode{background:#eee;color:#222;border:1px solid #ddd}
.btn-tipe.active,.btn-kode.active{background:#CC0000;color:#fff}
.table-wrap{overflow-x:auto;border:1px solid #ddd;border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border:1px solid #ddd;padding:7px 6px;text-align:center;white-space:nowrap;font-size:13px}
th{background:#CC0000;color:#fff}
th:first-child,td:first-child{text-align:left;min-width:130px}
tr:nth-child(even) td{background:#fff5f5}
.swipe-hint{font-size:12px;color:#888;text-align:center;margin:6px 0 0}
.wa{display:block;text-align:center;background:#25D366;color:#fff;padding:13px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:12px}
.info{background:#fff5f5;border:1px solid #ffcccc;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.7}
.info b{color:#CC0000}
</style>
</head>
<body>
<div class="header"><h1>DAFTAR HARGA PCX & STYLO</h1><div>Harga OTR - DP - Angsuran</div></div>
<div class="wrap">
  <div class="card"><b>1. Pilih Tipe Motor:</b><br><br><div id="tipeList"></div></div>
  <div class="card" id="kodeBox" style="display:none"><b>2. Pilih Kode:</b><br><br><div id="kodeList"></div></div>
  <div class="card" id="hasilBox" style="display:none">
    <div id="loading">Loading...</div>
    <div id="infoBox"></div>
    <div class="table-wrap"><div id="tabel"></div></div>
    <div class="swipe-hint">Geser tabel ke kiri untuk lihat angsuran lainnya</div>
    <a class="wa" href="https://wa.me/6285183349948" target="_blank">Update PL tanya admin/wa</a>
  </div>
</div>
<script>
const CONFIG = {
  MOTORS: {
    PCX: { label: "HONDA PCX", spreadsheetId: "1ERT9boBpF16VrVNBSRD6P1hTm6D0IsX16at6R3ZPtBs", kodes: ["MTZ", "MVZ", "MWZ", "MT1", "MV1", "MW1"] },
    STYLO: { label: "HONDA STYLO", spreadsheetId: "1Sveq5riagQ08sH4YzjIlKJCyrVSGbhc-ZjHWZ1i-Vv4", kodes: ["MFW", "MFV", "MGV", "MGX", "MF1"] }
  }
};
let tipeAktif = "";
function txt(v){ return v == null ? "" : String(v); }

// === PAKAI JSON, BUKAN CSV LAGI ===
async function ambilSheet(id, sheet) {
  const url = 'https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(sheet);
  const res = await fetch(url);
  let text = await res.text();
  // Potong "google.visualization.Query.setResponse(...);"
  let start = text.indexOf("{");
  let end = text.lastIndexOf("}");
  let json = JSON.parse(text.substring(start, end+1));
  let rows = json.table.rows || [];
  return rows.map(function(r){
    let cells = r.c || [];
    let out = [];
    for(let i=0;i<cells.length;i++){
      let cell = cells[i];
      if(!cell){ out.push(""); continue; }
      // f = tampilan asli di Sheet (misal "Rp31.464.000", "2.000.000")
      // v = nilai mentah (angka)
      if(cell.f != null && cell.f !== "") out.push(cell.f);
      else if(cell.v != null) out.push(cell.v);
      else out.push("");
    }
    return out;
  });
}
function formatAngka(v){ if(typeof v === 'number') return v.toLocaleString('id-ID'); return v; }
function renderTipe(){
  let h = "";
  for(let key in CONFIG.MOTORS){ h += '<button class="btn btn-tipe" onclick="pilihTipe(\''+key+'\')">'+CONFIG.MOTORS[key].label+'</button>'; }
  document.getElementById('tipeList').innerHTML = h;
}
function pilihTipe(tipe){
  tipeAktif = tipe;
  document.querySelectorAll('.btn-tipe').forEach(function(b){ b.classList.remove('active'); });
  event.target.classList.add('active');
  document.getElementById('kodeBox').style.display = 'block';
  document.getElementById('hasilBox').style.display = 'none';
  let h = "";
  CONFIG.MOTORS[tipe].kodes.forEach(function(k){ h += '<button class="btn btn-kode" onclick="pilihKode(this,\''+k+'\')">'+k+'</button>'; });
  document.getElementById('kodeList').innerHTML = h;
}
async function pilihKode(el, kode){
  document.querySelectorAll('.btn-kode').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('hasilBox').style.display = 'block';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('loading').innerText = 'Loading...';
  document.getElementById('tabel').innerHTML = '';
  document.getElementById('infoBox').innerHTML = '';
  try{
    let semua = await ambilSheet(CONFIG.MOTORS[tipeAktif].spreadsheetId, kode);

    // ===== CARI HEADER DARI JSON, JAUH LEBIH AKURAT =====
    // JSON gak geser, jadi sel B, C, D persis kayak di Sheet
    let idxHead = -1;
    for(let i=0;i<semua.length;i++){
      let b = txt(semua[i][1]).toUpperCase().replace(":","").trim();
      let c = txt(semua[i][2]).toUpperCase().trim();
      // Baris header tabel: B=TYPE, C=UANG
      // Baris "Type : STYLO..." ke-skip karena C nya angka, bukan UANG
      if(b === "TYPE" && c.indexOf("UANG") !== -1){ idxHead = i; break; }
    }
    if(idxHead === -1) idxHead = 4;

    let r1 = semua[idxHead] || [];
    let r2 = semua[idxHead+1] || [];

    // HEADER dari Sheet
    let header = [];
    header.push(txt(r1[1]).replace(":","").trim());
    header.push((txt(r1[2]) + " " + txt(r2[2])).trim());
    header.push((txt(r1[3]) + " " + txt(r2[3])).trim());
    for(let c=4;c<r1.length;c++){
      let v = txt(r1[c]).trim();
      if(v !== "") header.push(v);
    }

    // INFO ATAS: cari sel yang ada AREA / PROGRAM / BERLAKU, per sel
    let area = "", program = "", berlaku = "";
    for(let i=0;i<semua.length;i++){
      for(let c=0;c<semua[i].length;c++){
        let v = txt(semua[i][c]);
        let up = v.toUpperCase();
        if(up.indexOf("AREA") !== -1){
          // Ambil sel ini + sel sebelahnya, biar "K A P U A S" keambil utuh
          let gab = v + " " + txt(semua[i][c+1]) + " " + txt(semua[i][c+2]);
          // Buang kata AREA dan PROGRAM dari gabungan itu
          let s = gab.replace(/AREA/gi,"").replace(/:/g,"").replace(/PROGRAM.*/gi,"").trim();
          // "K A P U A S" -> "KAPUAS" (buang spasi antar huruf 1 karakter)
          s = s.replace(/\b([A-Z])\s+(?=[A-Z]\b)/g,"$1").replace(/\s+/g," ").trim();
          if(s !== "") area = s;
        }
        if(up.indexOf("PROGRAM") !== -1 || up.indexOf("PROG.") !== -1){
          let s = v.replace(/PROGRAM/gi,"").replace(/PROG\./gi,"").replace(/:/g,"").trim();
          let s2 = txt(semua[i][c+1]).trim();
          if(s2 !== "" && s2.toUpperCase().indexOf("BERLAKU") === -1) s += (s ? " " : "") + s2;
          if(s !== "") program = s;
        }
        if(up.indexOf("BERLAKU") !== -1){
          let s = v.replace(/BERLAKU/gi,"").replace(/:/g,"").trim();
          if(s === "") s = txt(semua[i][c+1]).trim();
          if(s !== "") berlaku = s;
        }
      }
    }

    // TIPE + OTR
    let tipeMotor = "", otr = "";
    for(let i=0;i<semua.length;i++){
      let b = txt(semua[i][1]);
      let c = txt(semua[i][2]);
      if(b.indexOf("Rp") !== -1 && c.toUpperCase().indexOf("SUBSIDI") !== -1) otr = b;
      if(tipeMotor === "" && (b.toUpperCase().indexOf("PCX") !== -1 || b.toUpperCase().indexOf("STYLO") !== -1)){
        let numC = Number(txt(c).replace(/\./g,"").replace(/,/g,"").replace(/Rp/g,"").trim());
        if(c !== "" && !isNaN(numC) && numC > 100000) tipeMotor = b;
      }
    }

    // DATA: setelah header, yang kolom C angka DP
    let rows = [];
    for(let i=idxHead+2;i<semua.length;i++){
      let b = txt(semua[i][2]).replace(/\./g,"").replace(/,/g,"").replace(/Rp/g,"").replace(/ /g,"");
      if(b !== "" && !isNaN(Number(b)) && Number(b) > 100000) rows.push(semua[i]);
    }

    document.getElementById('loading').style.display = 'none';
    let info = '<div class="info">';
    if(tipeMotor) info += '<b>' + tipeMotor + '</b><br>';
    if(otr) info += 'OTR: <b>' + otr + '</b><br>';
    if(area) info += 'Area: ' + area + ' &nbsp;|&nbsp; ';
    if(berlaku) info += 'Berlaku: ' + berlaku + ' &nbsp;|&nbsp; ';
    if(program) info += 'Program: ' + program;
    info += '</div>';
    document.getElementById('infoBox').innerHTML = info;

    let h = "<table><tr>";
    header.forEach(function(c){ h += "<th>"+c+"</th>"; });
    h += "</tr>";
    rows.forEach(function(r, idx){
      h += "<tr><td>" + (idx === 0 ? tipeMotor : "") + "</td>";
      for(let i=2;i<2+header.length-1;i++){ h += "<td>" + formatAngka(r[i] == null ? "" : r[i]) + "</td>"; }
      h += "</tr>";
    });
    h += "</table>";
    document.getElementById('tabel').innerHTML = h;
  }catch(e){
    document.getElementById('loading').innerText = 'Error: ' + e.message;
  }
}
renderTipe();
</script>
</body>
</html>
