<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price List Honda - NSS Kapuas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:'Poppins',Arial, sans-serif;background:#f4f4f4;padding:0}
  .header{background:#E60012;color:#fff;padding:22px 14px 20px;text-align:center;border-radius:0 0 20px 20px;box-shadow:0 3px 10px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:1.5px;line-height:1.1;text-align:center}
  .header .sub{margin:6px 0 0;font-size:16px;font-weight:700;letter-spacing:3px;text-align:center}
  .header .desc{margin:6px 0 0;font-size:11px;font-weight:600;letter-spacing:0.5px;text-align:center;opacity:.85}
  .wrap{padding:12px}
  .tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:13px 18px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;background:#fff;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap;font-family:'Poppins',Arial,sans-serif}
  .tabs button.active{background:#E60012;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chips button{padding:9px 16px;border:1px solid #ddd;background:#fff;border-radius:20px;font-weight:700;cursor:pointer;font-size:14px;font-family:'Poppins',Arial,sans-serif}
  .chips button.active{background:#111;color:#fff;border-color:#111}
  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
  .card h3{margin:0 0 10px;font-size:18px;color:#E60012;border-bottom:2px solid #E60012;padding-bottom:8px}

  /* === FREEZE TENOR DI SINI === */
  .table-wrap{max-height:65vh;overflow:auto;border:1px solid #eee;border-radius:10px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  th,td{border-bottom:1px solid #eee;padding:8px 8px;text-align:left;white-space:nowrap}
  tr:nth-child(even) td{background:#fafafa}
  td{color:#222}
  /* Baris pertama = Tenor, dibikin nempel */
  tr:first-child td{
    position:sticky;top:0;z-index:5;
    background:#fff !important;
    font-weight:900;font-size:15px;
    border-bottom:2px solid #E60012;
    box-shadow:0 2px 4px rgba(0,0,0,.08);
  }

  .empty{text-align:center;padding:50px 20px;color:#999;background:#fff;border-radius:16px;line-height:1.6}
  .loading{text-align:center;padding:30px;color:#777}
  .footer{text-align:center;font-size:11px;color:#aaa;padding:12px}
</style>
</head>
<body>
<div class="header"><h1>PRICE LIST HONDA</h1><p class="sub">NSS KAPUAS</p><p class="desc">Area kapuas • update otomatis dari spreadsheet</p></div>
<div class="wrap">
<div class="tabs" id="motorTabs"></div>
<div class="chips" id="chips"></div>
<div id="list"><div class="empty">👆 Silahkan pilih kode di atas dulu<br><small>Contoh: MTZ, MFW, MYA...</small></div></div>
<div class="footer">Honda Kapuas - Harga dapat berubah sewaktu-waktu</div>
</div>
<script>
const SHEET_ID = "1gs1mlan-b86O2ZyCiHLzsxvo8tRdiDuu9SXXShpJLBY";
const CONFIG = {
  PCX:       ["MTZ","MVZ","MWZ","MT1","MV1","MW1"],
  STYLO:     ["MFW","MFV","MGV","MGX","MF1"],
  "VARIO EVO": ["MYA","MYL","MY0","MZ0"],
  "VARIO 125": ["ND0","NE0","NF0","NFZ","NFV"],
  "ADV 160":   ["NA0","NB0","NC0"]
};
let current = "PCX", activeCode = null;
let cache = {};
function renderMotorTabs(){
  document.getElementById("motorTabs").innerHTML = Object.keys(CONFIG).map(m=>`<button class="${current==m?"active":""}" onclick="switchMotor('${m}')">${m}</button>`).join("");
}
function switchMotor(m){
  current=m; activeCode=null; cache={};
  renderMotorTabs(); renderChips();
  document.getElementById("list").innerHTML = `<div class="empty">👆 Silahkan pilih kode di atas dulu<br><small>${CONFIG[m].join(", ")}</small></div>`;
}
function renderChips(){
  const tabs = CONFIG[current];
  document.getElementById("chips").innerHTML = tabs.map(t=>`<button class="${activeCode==t?"active":""}" onclick="setCode('${t}')">${t}</button>`).join("");
}
async function setCode(c){
  activeCode=c; renderChips();
  document.getElementById("list").innerHTML = `<div class="loading">Lagi ngambil ${c}...</div>`;
  if(!cache[c]){
    try{
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${c}`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
      let rows = json.table.rows.map(r => (r.c||[]).map(cell => cell ? (cell.f || cell.v) : ""));
      let maxCol = 0;
      rows.forEach(r=>{ for(let i=r.length-1;i>=0;i--){ if(String(r[i]).trim()!==""){ maxCol=Math.max(maxCol,i); break; } } });
      rows = rows.map(r => r.slice(0, maxCol+1));
      rows = rows.filter(r => r.some(cell => String(cell).trim() !== ""));
      let keepCol = [];
      for(let col=0; col<=maxCol; col++){
        if(rows.some(r => String(r[col]||"").trim() !== "")) keepCol.push(col);
      }
      rows = rows.map(r => keepCol.map(col => r[col]||""));
      cache[c] = rows;
    }catch(e){ cache[c] = [["Gagal ambil "+c+" - Cek nama Sheet / Izin Spreadsheet"]]; }
  }
  const rows = cache[c];
  const table = `<div class="table-wrap"><table>${rows.map(r=>`<tr>${r.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}</table></div>`;
  document.getElementById("list").innerHTML = `<div class="card"><h3>[${c}] ${current} - PRICE LIST</h3>${table}</div>`;
}
renderMotorTabs(); renderChips();
</script>
</body>
</html>
