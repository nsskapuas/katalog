<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price List Honda - Kapuas</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial;background:#f2f2f2;padding:12px}
  h1{text-align:center;font-size:22px;margin:6px 0 2px} .sub{text-align:center;color:#777;font-size:13px;margin-bottom:12px}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;background:#ddd}
  .tabs button.active{background:#d60000;color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chips button{padding:8px 12px;border:1px solid #ddd;background:#fff;border-radius:20px;font-weight:700;cursor:pointer}
  .chips button.active{background:#111;color:#fff}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
  .card h3{margin:0 0 10px;font-size:18px}
  table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
  th,td{border:1px solid #eee;padding:6px 8px;text-align:left;white-space:nowrap}
  td{color:#222} .loading{text-align:center;padding:30px;color:#777}
</style>
</head>
<body>
<h1>PRICE LIST HONDA</h1><div class="sub">AREA: KAPUAS - Update Otomatis dari Spreadsheet</div>
<div class="tabs">
  <button id="btnStylo" class="active" onclick="switchMotor('STYLO')">STYLO</button>
  <button id="btnPcx" onclick="switchMotor('PCX')">PCX</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"><div class="loading">Lagi ngambil...</div></div>
<script>
const CONFIG = {
  STYLO: { id: "1Sveq5riagQ08sH4YzjIlKJCyrVSGbhc-ZjHWZ1i-Vv4", tabs: ["MFW","MFV","MGV","MGX","MF1"] },
  PCX:   { id: "1ERT9boBpF16VrVNBSRD6P1hTm6D0IsX16at6R3ZPtBs", tabs: ["MTZ","MVZ","MWZ","MT1","MV1","MW1"] }
};
let current = "STYLO", activeCode = "SEMUA";
let cache = {};

function switchMotor(m){
  current=m; activeCode="SEMUA";
  document.getElementById("btnStylo").className = m=="STYLO"?"active":"";
  document.getElementById("btnPcx").className = m=="PCX"?"active":"";
  load();
}
function renderChips(){
  const tabs = CONFIG[current].tabs;
  document.getElementById("chips").innerHTML = `<button class="${activeCode=="SEMUA"?"active":""}" onclick="setCode('SEMUA')">SEMUA</button>` + tabs.map(t=>`<button class="${activeCode==t?"active":""}" onclick="setCode('${t}')">${t}</button>`).join("");
}
function setCode(c){ activeCode=c; renderChips(); render(); }

async function fetchSheet(id, tab){
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${tab}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}')+1));
  const rows = json.table.rows.map(r => (r.c||[]).map(cell => cell ? (cell.f || cell.v) : ""));
  // buang baris yang bener-bener kosong semua
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
async function load(){
  renderChips();
  document.getElementById("list").innerHTML = `<div class="loading">Lagi ngambil ${current}...</div>`;
  const cfg = CONFIG[current];
  cache = {};
  for(const tab of cfg.tabs){
    try{ cache[tab] = await fetchSheet(cfg.id, tab); }
    catch(e){ cache[tab] = [["Gagal ambil "+tab+" - cek izin Anyone with link"]]; }
  }
  render();
}
function render(){
  const list = document.getElementById("list");
  const tabs = activeCode=="SEMUA" ? CONFIG[current].tabs : [activeCode];
  let html = "";
  tabs.forEach(tab=>{
    const rows = cache[tab] || [];
    const table = `<table>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
    html += `<div class="card"><h3>[${tab}]</h3>${table}</div>`;
  });
  list.innerHTML = html || "Gak ketemu.";
}
load();
</script>
</body>
</html>
